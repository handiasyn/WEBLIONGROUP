<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chess Game Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="reg-page" id="formScreen">

  <div class="reg-header">
    <button class="icon-btn" onclick="history.back()" style="background:#F3F4F6;">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#111827" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="reg-title">Chess Game Registration</div>
    <div class="spacer44"></div>
  </div>

  <div class="reg-sheet">

    <!-- Participant 1 (self) -->
    <div class="reg-field-group">
      <div class="reg-field readonly">
        <div class="reg-field-body">
          <div class="reg-field-label">ID Karyawan 1</div>
          <div class="reg-field-value" id="p1Id">240185</div>
        </div>
      </div>
      <div class="reg-field readonly">
        <div class="reg-field-body">
          <div class="reg-field-label">Nama Karyawan 1</div>
          <div class="reg-field-value" id="p1Name">Handias Yusuf N.</div>
        </div>
      </div>
    </div>

    <!-- WA phone -->
    <div class="reg-field">
      <div class="reg-field-body">
        <input type="tel" id="waPhone" placeholder="No HP untuk Grup WA" inputmode="tel">
      </div>
    </div>

    <!-- Punya papan catur -->
    <div class="reg-field">
      <div class="reg-field-body">
        <select id="hasBoard">
          <option value="" disabled selected>Apakah anda memiliki Papan Catur ?</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <svg class="reg-field-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="reg-terms">Dengan Klik <b>Daftar</b>, Anda telah membaca dan menyetujui <b>Syarat dan Ketentuan Pertandingan Catur</b></div>
  </div>

  <div class="reg-fixed-footer">
    <button class="btn-register" id="submitBtn">Submit</button>
  </div>
</div>

<!-- ============ CONFIRM MODAL ============ -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <button class="modal-close" id="modalCloseBtn">
      <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#000" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <div class="modal-title">Data sudah sesuai?</div>
    <div class="modal-body">Pastikan data sudah sesuai. Data yang sudah di-submit tidak dapat diubah kembali.</div>
    <div class="modal-actions">
      <button class="btn-modal-secondary" id="checkAgainBtn">Cek Lagi</button>
      <button class="btn-modal-primary" id="confirmSubmitBtn">Ya, Submit</button>
    </div>
  </div>
</div>

<script>
  (function () {
    try {
      const idStaff = sessionStorage.getItem('idStaff');
      if (idStaff) {
        document.getElementById('p1Id').textContent = idStaff;
        document.getElementById('p1Name').textContent = idStaff;
      }
    } catch (e) { /* no-op */ }

    const modal = document.getElementById('confirmModal');
    document.getElementById('submitBtn').addEventListener('click', function () {
      const phone = document.getElementById('waPhone').value.trim();
      const hasBoard = document.getElementById('hasBoard').value;
      if (!phone) { alert('Isi No HP untuk Grup WA dulu ya.'); return; }
      if (!hasBoard) { alert('Pilih apakah kamu punya papan catur dulu ya.'); return; }
      modal.classList.add('open');
    });

    document.getElementById('modalCloseBtn').addEventListener('click', function () { modal.classList.remove('open'); });
    document.getElementById('checkAgainBtn').addEventListener('click', function () { modal.classList.remove('open'); });

    function formatRegTime() {
      const d = new Date();
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      const pad = function (n) { return n < 10 ? '0' + n : n; };
      return pad(d.getDate()) + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    document.getElementById('confirmSubmitBtn').addEventListener('click', function () {
      try {
        const raw = sessionStorage.getItem('registeredSports');
        const arr = raw ? JSON.parse(raw) : [];
        arr.push({
          sport: 'Chess',
          subtitle: '',
          status: 'Pending',
          registeredAt: formatRegTime(),
          participants: [
            { name: document.getElementById('p1Name').textContent, id: document.getElementById('p1Id').textContent, division: '' }
          ]
        });
        sessionStorage.setItem('registeredSports', JSON.stringify(arr));
      } catch (e) { /* no-op */ }

      // TODO: replace with a real submit call to your backend, sending:
      // { waPhone: phone, hasBoard }
      location.href = 'registration-sent.html?sport=' + encodeURIComponent('Chess');
    });
  })();
</script>

</body>
</html>
