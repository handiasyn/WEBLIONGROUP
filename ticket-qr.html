<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QR Check In - HUT Lion Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>

<div class="qr-page">

  <div class="qr-topbar">
    <button class="icon-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#111827" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" onclick="if(navigator.share){navigator.share({title:document.title,url:location.href})}">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a3 3 0 1 0-2.83-4M6 15a3 3 0 1 0 2.83 4M8.7 13.5l6.6 3.8M15.3 6.7l-6.6 3.8" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="qr-logo-wrap">
    <img src="assets/logo.png" alt="Lion Group" onerror="this.src='https://placehold.co/190x107?text=Lion+Group'">
  </div>

  <div class="qr-brand">
    <div class="l1">HUT LION GROUP</div>
    <div class="l2">ONE SKY ANNIVERSARY</div>
  </div>

  <div class="qr-code-frame" id="qrFullFrame"></div>

  <div class="qr-caption">
    <img src="assets/logo-round.png" alt="" onerror="this.src='https://placehold.co/83x83?text=LG'">
    <p>Tunjukkan QR Code ini saat proses registrasi ulang</p>
  </div>

  <div class="qr-footer">
    <div class="qr-footer-text">ONE VISION - ONE SKY - ONE FAMILY</div>
    <img src="assets/logo-round.png" alt="" onerror="this.src='https://placehold.co/56x56?text=LG'">
  </div>

</div>

<script>
  (function () {
    function safeGet(key, fallback) {
      try {
        const v = sessionStorage.getItem(key);
        return v !== null && v !== '' ? v : fallback;
      } catch (e) { return fallback; }
    }

    const idStaff = safeGet('idStaff', '240185');
    const kodeRegist = safeGet('ticketRegCode', 'UBXAWX');
    const qrPayload = 'LIONGROUP-CHECKIN|ID:' + idStaff + '|CODE:' + kodeRegist;

    try {
      const qr = qrcode(0, 'M');
      qr.addData(qrPayload);
      qr.make();
      document.getElementById('qrFullFrame').innerHTML = qr.createSvgTag(6, 0);
    } catch (e) {
      document.getElementById('qrFullFrame').innerHTML =
        '<img src="https://placehold.co/299x299?text=QR+Code" style="width:100%;height:100%;object-fit:contain;">';
    }
  })();
</script>

</body>
</html>
