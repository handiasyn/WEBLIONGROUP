<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Events - Lion Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="decor-circle"></div>
    <div class="page-title">My Events</div>
  </header>

  <main class="content" id="eventsList">
    <!-- ticket cards injected by script -->
  </main>
</div>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 28 28" fill="none"><rect x="3.5" y="4.7" width="21" height="21" rx="3" stroke="black" stroke-width="1.75"/><path d="M9.3 2.3v4.7M18.7 2.3v4.7M3.5 11.7h21" stroke="black" stroke-width="1.75"/></svg>
      <span>Event List</span>
    </a>
    <a class="nav-item active" href="tickets.html">
      <svg viewBox="0 0 28 28" fill="none"><path d="M4 11a2.5 2.5 0 0 0 0 5v4.5A1.5 1.5 0 0 0 5.5 22h17a1.5 1.5 0 0 0 1.5-1.5V16a2.5 2.5 0 0 1 0-5V7.5A1.5 1.5 0 0 0 22.5 6h-17A1.5 1.5 0 0 0 4 7.5Z" stroke="#CF0206" stroke-width="1.75"/></svg>
      <span>My Events</span>
    </a>
    <a class="nav-item" href="lionpay.html">
      <svg viewBox="0 0 28 28" fill="none"><rect x="2.3" y="4.7" width="23.3" height="18.7" rx="3" stroke="black" stroke-width="1.75"/><path d="M18.3 12.3h4.7a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-4.7a3 3 0 0 1 0-6Z" stroke="black" stroke-width="1.75"/></svg>
      <span>Lion Pay</span>
    </a>
    <a class="nav-item" href="account.html">
      <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="11.7" stroke="black" stroke-width="1.75"/><circle cx="14" cy="11" r="4" stroke="black" stroke-width="1.75"/><path d="M6.5 22a7.7 7.7 0 0 1 15 0" stroke="black" stroke-width="1.75"/></svg>
      <span>Account</span>
    </a>
  </div>
</nav>

<script>
  function safeGet(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }

  function getRegisteredSports() {
    try {
      const raw = sessionStorage.getItem('registeredSports');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  const calendarIcon = '<svg class="ticket-icon" viewBox="0 0 26 26" fill="none"><rect x="3" y="4" width="20" height="18" rx="2.5" stroke="#D50006" stroke-width="1.5"/><path d="M8 2v5M18 2v5M3 10h20" stroke="#D50006" stroke-width="1.5"/></svg>';
  const pinIcon = '<svg class="ticket-icon" viewBox="0 0 26 26" fill="none"><path d="M13 23.5s8-6.9 8-13.4a8 8 0 1 0-16 0c0 6.5 8 13.4 8 13.4Z" stroke="#E21219" stroke-width="1.5"/><circle cx="13" cy="10" r="2.7" stroke="#E21219" stroke-width="1.5"/></svg>';
  const sportIcon = '<svg viewBox="0 0 24 24" fill="none"><path d="M8 2l4 2 4-2" stroke="#E21219" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="#E21219" stroke-width="1.8"/><path d="M9.5 13.75l5 2.25" stroke="#E21219" stroke-width="1.8" stroke-linecap="round"/></svg>';

  function grandEventTicketTemplate() {
    const regCode = safeGet('ticketRegCode');
    if (!regCode) return '';
    return '<article class="ticket-card">' +
      '<div class="ticket-banner"><div class="event-name">HUT Lion Group</div></div>' +
      '<div class="ticket-body">' +
        '<div class="ticket-meta">' +
          '<div class="ticket-meta-col">' + calendarIcon + '</div>' +
          '<div class="ticket-meta-col"><span class="label">Event Date</span><span class="value">25 SEP 2026</span></div>' +
          '<div class="ticket-meta-col" style="margin-left:12px">' + pinIcon + '</div>' +
          '<div class="ticket-meta-col"><span class="label">Location</span><span class="value">GD. BALARAJA</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="ticket-footer">' +
        '<button class="btn-show-ticket" onclick="location.href=\'ticket-detail.html\'">Show Ticket</button>' +
      '</div>' +
    '</article>';
  }

  function sportTicketTemplate(entry, index) {
    const status = (entry.status || 'Pending').toLowerCase();
    return '<article class="events-ticket-card">' +
      '<div class="events-status-badge ' + status + '">' + (entry.status || 'Pending') + '</div>' +
      '<div class="events-ticket-top">' +
        '<div class="events-ticket-head">' +
          '<div class="events-ticket-icon">' + sportIcon + '</div>' +
          '<div class="events-ticket-text">' +
            '<div class="events-ticket-title">' + entry.sport + '</div>' +
            (entry.subtitle ? '<div class="events-ticket-subtitle">' + entry.subtitle + '</div>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="events-ticket-footer">' +
        '<button class="btn-events-detail" onclick="location.href=\'sport-ticket-detail.html?index=' + index + '\'">Detail</button>' +
      '</div>' +
    '</article>';
  }

  const container = document.getElementById('eventsList');
  const registeredSports = getRegisteredSports();
  const grandEventHtml = grandEventTicketTemplate();

  let html = '';
  if (grandEventHtml) {
    html += '<section class="section"><div class="section-list">' + grandEventHtml + '</div></section>';
  }

  if (registeredSports.length) {
    html += '<section class="section"><div class="section-list">' +
      registeredSports.map(sportTicketTemplate).join('') +
      '</div></section>';
  }

  if (!grandEventHtml && !registeredSports.length) {
    html = '<div class="events-empty-state">Kamu belum daftar event apapun. Yuk cek Event List dan ikutan salah satu!</div>';
  }

  container.innerHTML = html;
</script>

</body>
</html>
