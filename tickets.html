<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Tickets - Lion Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .ticket-card{
    background:#fff;
    border-radius:20px;
    box-shadow:0 0 12px rgba(0,0,0,0.08);
    overflow:hidden;
    position:relative;
  }

  .ticket-banner{
    height: clamp(48px, 12vw, 56px);
    background: linear-gradient(90deg, #B10000 0%, #FF5050 100%);
    display:flex;
    align-items:center;
    padding: 0 32px;
  }

  .ticket-banner .event-name{
    color:#fff;
    font-size: clamp(20px, 6vw, 26px);
    font-weight:800;
  }

  .ticket-body{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding: 16px;
  }

  .ticket-meta{
    display:flex;
    align-items:center;
    gap:16px;
    flex:1 1 auto;
    min-width:0;
  }

  .ticket-meta-col{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }

  .ticket-meta-col .label{
    font-size:9px;
    letter-spacing:0.45px;
    text-transform:uppercase;
    color:#000;
    font-family:'Poppins', sans-serif;
  }

  .ticket-meta-col .value{
    font-size: clamp(11px, 3vw, 12px);
    font-weight:600;
    color:#000;
    font-family:'Poppins', sans-serif;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .ticket-icon{
    width:24px;
    height:24px;
    flex-shrink:0;
  }

  .btn-show-ticket{
    width:100%;
    margin-top:8px;
    padding:12px 24px;
    border:none;
    border-radius:12px;
    background: linear-gradient(0deg, var(--red-mid) 0%, var(--red-light) 100%);
    color:#fff;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size: clamp(14px, 4vw, 16px);
    font-weight:700;
    cursor:pointer;
  }

  .ticket-footer{ padding: 0 16px 16px; }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding: 48px 16px;
    color:var(--text-600);
    font-size:14px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="decor-circle"></div>
    <div class="page-title">My Tickets</div>
  </header>

  <main class="content" id="ticketList">
    <!-- ticket cards injected by script -->
  </main>
</div>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 28 28" fill="none"><rect x="3.5" y="4.7" width="21" height="21" rx="3" stroke="black" stroke-width="1.75"/><path d="M9.3 2.3v4.7M18.7 2.3v4.7M3.5 11.7h21" stroke="black" stroke-width="1.75"/></svg>
      <span>Event List</span>
    </a>
    <a class="nav-item active" href="tickets.html">
      <svg viewBox="0 0 28 28" fill="none"><path d="M4 11a2.5 2.5 0 0 0 0 5v4.5A1.5 1.5 0 0 0 5.5 22h17a1.5 1.5 0 0 0 1.5-1.5V16a2.5 2.5 0 0 1 0-5V7.5A1.5 1.5 0 0 0 22.5 6h-17A1.5 1.5 0 0 0 4 7.5Z" stroke="#CF0206" stroke-width="1.75"/></svg>
      <span>My Tickets</span>
    </a>
    <a class="nav-item" href="lionpay.html">
      <svg viewBox="0 0 28 28" fill="none"><rect x="2.3" y="4.7" width="23.3" height="18.7" rx="3" stroke="black" stroke-width="1.75"/><path d="M18.3 12.3h4.7a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-4.7a3 3 0 0 1 0-6Z" stroke="black" stroke-width="1.75"/></svg>
      <span>Lion Pay</span>
    </a>
    <a class="nav-item" href="account.html">
      <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="11.7" stroke="black" stroke-width="1.75"/><circle cx="14" cy="11" r="4" stroke="black" stroke-width="1.75"/><path d="M6.5 22a7.7 7.7 0 0 1 15 0" stroke="black" stroke-width="1.75"/></svg>
      <span>Account</span>
    </a>
  </div>
</nav>

<script>
  // Sample owned tickets — swap this array with real data from your backend/API
  const myTickets = [
    {
      id: 'hut-lion-group',
      name: 'HUT Lion Group',
      date: '25 SEP 2026',
      place: 'GD. BALARAJA'
    }
  ];

  const calendarIcon = '<svg class="ticket-icon" viewBox="0 0 26 26" fill="none"><rect x="3" y="4" width="20" height="18" rx="2.5" stroke="#D50006" stroke-width="1.5"/><path d="M8 2v5M18 2v5M3 10h20" stroke="#D50006" stroke-width="1.5"/></svg>';
  const pinIcon = '<svg class="ticket-icon" viewBox="0 0 26 26" fill="none"><path d="M13 23.5s8-6.9 8-13.4a8 8 0 1 0-16 0c0 6.5 8 13.4 8 13.4Z" stroke="#E21219" stroke-width="1.5"/><circle cx="13" cy="10" r="2.7" stroke="#E21219" stroke-width="1.5"/></svg>';

  function ticketTemplate(t) {
    return '<article class="ticket-card">' +
      '<div class="ticket-banner"><div class="event-name">' + t.name + '</div></div>' +
      '<div class="ticket-body">' +
        '<div class="ticket-meta">' +
          '<div class="ticket-meta-col">' +
            calendarIcon +
          '</div>' +
          '<div class="ticket-meta-col">' +
            '<span class="label">Event Date</span>' +
            '<span class="value">' + t.date + '</span>' +
          '</div>' +
          '<div class="ticket-meta-col" style="margin-left:12px">' +
            pinIcon +
          '</div>' +
          '<div class="ticket-meta-col">' +
            '<span class="label">Location</span>' +
            '<span class="value">' + t.place + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ticket-footer">' +
        '<button class="btn-show-ticket" onclick="location.href=\'ticket-detail.html?id=' + t.id + '\'">Show Ticket</button>' +
      '</div>' +
    '</article>';
  }

  const container = document.getElementById('ticketList');
  if (myTickets.length) {
    container.innerHTML = myTickets.map(ticketTemplate).join('');
  } else {
    container.innerHTML = '<div class="empty-state">Kamu belum punya tiket. Yuk ikutan salah satu event di halaman Event List!</div>';
  }
</script>

</body>
</html>
