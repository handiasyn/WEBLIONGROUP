<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mini Soccer Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="reg-page" id="formScreen">

  <div class="reg-header">
    <button class="icon-btn" onclick="history.back()" style="background:#F3F4F6;">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#111827" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="reg-title">Mini Soccer Match Registration</div>
    <div class="spacer44"></div>
  </div>

  <div class="reg-sheet">

    <!-- Cluster Kerja -->
    <div class="reg-field">
      <div class="reg-field-body">
        <select id="clusterKerja">
          <option value="" disabled selected>Cluster Kerja</option>
          <option>Cluster Ground Operation</option>
          <option>Cluster Cabin Crew</option>
          <option>Cluster Engineering</option>
          <option>Cluster Corporate</option>
          <option>Cluster IT</option>
        </select>
      </div>
      <svg class="reg-field-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- Captain phone -->
    <div class="reg-field">
      <div class="reg-field-body">
        <input type="tel" id="captainPhone" placeholder="No HP Perwakilan (Captain Team)" inputmode="tel">
      </div>
    </div>

    <!-- Participant list -->
    <div class="participant-group" id="participantList">
      <div class="participant-pair" data-participant="1">
        <div class="reg-field readonly">
          <div class="reg-field-body">
            <div class="reg-field-label">ID Karyawan 1</div>
            <div class="reg-field-value" id="p1Id">240185</div>
          </div>
        </div>
        <div class="reg-field readonly">
          <div class="reg-field-body">
            <div class="reg-field-label">Nama Karyawan 1</div>
            <div class="reg-field-value" id="p1Name">Handias Yusuf N.</div>
          </div>
        </div>
      </div>
    </div>

    <button class="btn-add-more" id="addParticipantBtn">Add More Participants</button>

    <div class="reg-terms">Dengan Klik <b>Daftar</b>, Anda telah membaca dan menyetujui <b>Syarat dan Ketentuan Pertandingan Minisoccer</b></div>
  </div>

  <div class="reg-fixed-footer">
    <button class="btn-register" id="submitBtn">Submit</button>
  </div>
</div>

<!-- ============ CONFIRM MODAL ============ -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <button class="modal-close" id="modalCloseBtn">
      <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#000" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <div class="modal-title">Data sudah sesuai?</div>
    <div class="modal-body">Pastikan data sudah sesuai. Data yang sudah di-submit tidak dapat diubah kembali.</div>
    <div class="modal-actions">
      <button class="btn-modal-secondary" id="checkAgainBtn">Cek Lagi</button>
      <button class="btn-modal-primary" id="confirmSubmitBtn">Ya, Submit</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const MAX_PARTICIPANTS = 7;
    let participantCount = 1;

    try {
      const idStaff = sessionStorage.getItem('idStaff');
      if (idStaff) {
        document.getElementById('p1Id').textContent = idStaff;
        document.getElementById('p1Name').textContent = idStaff;
      }
    } catch (e) { /* no-op, keep sample data */ }

    const list = document.getElementById('participantList');
    const addBtn = document.getElementById('addParticipantBtn');

    function addParticipantRow() {
      if (participantCount >= MAX_PARTICIPANTS) return;
      participantCount++;
      const n = participantCount;

      const wrap = document.createElement('div');
      wrap.className = 'participant-pair';
      wrap.dataset.participant = n;
      wrap.innerHTML =
        '<div class="participant-remove-row"><button type="button" class="btn-remove-participant">Hapus Peserta ' + n + '</button></div>' +
        '<div class="reg-field editable-id">' +
          '<div class="reg-field-body">' +
            '<div class="reg-field-label">ID Karyawan ' + n + '</div>' +
            '<input type="text" inputmode="numeric" placeholder="Masukkan ID Karyawan">' +
          '</div>' +
        '</div>' +
        '<div class="reg-field editable-id">' +
          '<div class="reg-field-body">' +
            '<div class="reg-field-label">Nama Peserta ' + n + '</div>' +
            '<input type="text" placeholder="Nama lengkap peserta">' +
          '</div>' +
        '</div>';

      list.appendChild(wrap);

      wrap.querySelector('.btn-remove-participant').addEventListener('click', function () {
        wrap.remove();
        participantCount--;
        addBtn.style.display = '';
      });

      if (participantCount >= MAX_PARTICIPANTS) addBtn.style.display = 'none';
    }

    addBtn.addEventListener('click', addParticipantRow);

    // ---- submit -> confirm modal ----
    const modal = document.getElementById('confirmModal');
    document.getElementById('submitBtn').addEventListener('click', function () {
      const cluster = document.getElementById('clusterKerja').value;
      const phone = document.getElementById('captainPhone').value.trim();
      if (!cluster) { alert('Pilih Cluster Kerja dulu ya.'); return; }
      if (!phone) { alert('Isi No HP Perwakilan (Captain Team) dulu ya.'); return; }
      modal.classList.add('open');
    });

    document.getElementById('modalCloseBtn').addEventListener('click', function () { modal.classList.remove('open'); });
    document.getElementById('checkAgainBtn').addEventListener('click', function () { modal.classList.remove('open'); });

    function formatRegTime() {
      const d = new Date();
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      const pad = function (n) { return n < 10 ? '0' + n : n; };
      return pad(d.getDate()) + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function collectParticipants() {
      const rows = list.querySelectorAll('.participant-pair');
      const cluster = document.getElementById('clusterKerja').value;
      const arr = [];
      rows.forEach(function (row, i) {
        if (i === 0) {
          arr.push({ name: document.getElementById('p1Name').textContent, id: document.getElementById('p1Id').textContent, division: cluster });
        } else {
          const inputs = row.querySelectorAll('input');
          arr.push({ name: inputs[1].value.trim() || ('Peserta ' + (i + 1)), id: inputs[0].value.trim() || '-', division: cluster });
        }
      });
      return arr;
    }

    document.getElementById('confirmSubmitBtn').addEventListener('click', function () {
      const participants = collectParticipants();

      try {
        const raw = sessionStorage.getItem('registeredSports');
        const arr = raw ? JSON.parse(raw) : [];
        arr.push({
          sport: 'Mini Soccer',
          subtitle: 'Team of ' + participants.length,
          status: 'Pending',
          registeredAt: formatRegTime(),
          participants: participants
        });
        sessionStorage.setItem('registeredSports', JSON.stringify(arr));
      } catch (e) { /* no-op */ }

      // TODO: replace with real submit call to your backend, sending:
      // { clusterKerja, captainPhone, participants }
      location.href = 'registration-sent.html?sport=' + encodeURIComponent('Mini Soccer');
    });
  })();
</script>

</body>
</html>
